# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# Multi-Loader Configuration
enabled_platforms=fabric,forge

# Minecraft version target
minecraft_version=1.20.1

# Fabric Properties
# Check these on https://fabricmc.net/develop
fabric_loader_version=0.16.4
fabric_api_version=0.92.7+1.20.1

# Forge version for target Minecraft version
# Check these on https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=1.20.1-47.4.10

# NeoForge version for target Minecraft version
# Check these on https://neoforged.net/
neoforge_version=21.1.216
neoforge_loader_version_range=[2,)

# Architectury Properties (for multiloader support)
architectury_plugin_version=3.4-SNAPSHOT
loom_version=1.11-SNAPSHOT

# Mod Properties
mod_version=3.3.0-DEV-a4
maven_group=win.demistorm.stormiespiders
mod_id=stormiespiders
mod_name=Stormie's Spiders
mod_author=Halfstorm
license=GNU-LGPL v2.1
credits=TheCyberBrick and Nyfaria
description=You wish spiders would actually climb properly? \
  Stormie's Spiders enables spiders to walk along walls and ceilings and it improves their AI \
  so that they can find their way around almost any obstacle!

# Mappings
parchment_version=1.20.1:2023.09.03

# MixinExtras for Forge
mixin_extras_version=0.5.3

# Mod Menu for Fabric (optional dependency)
modmenu_version=7.0.1
