plugins {
    id("com.gradleup.shadow") version "9.4.1"
}

repositories {
    maven {
        url "https://maven.neoforged.net/releases/"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

// Custom jar naming: stormiespiders-neoforge-26.1-3.2.0-DEV-a7.jar
base {
    archivesName = "${rootProject.mod_id}-neoforge-${rootProject.minecraft_version}"
}
version = rootProject.mod_version

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_author", project.mod_author
    inputs.property "license", project.license
    inputs.property "credits", project.credits
    inputs.property "description", project.description
    inputs.property "neoforge_version", project.neoforge_version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
               "mod_id": project.mod_id,
               "mod_name": project.mod_name,
               "mod_author": project.mod_author,
               "license": project.license,
               "credits": project.credits,
               "description": project.description,
               "neoforge_version": project.neoforge_version,
               "minecraft_version": project.minecraft_version
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    exclude "architectury.common.json"
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.mod_id + "-" + project.name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here
    }
}
