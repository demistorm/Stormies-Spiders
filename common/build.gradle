// Configure Architectury for this common module
// This tells Architectury which loaders we're building for
architectury {
    common(rootProject.enabled_platforms.split(","))
}

// Loom configuration for the common module
loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    // Custom refmap name to avoid -common suffix
    // This sets the output refmap file name for the common module
    mixin {
        defaultRefmapName.set("${mod_id}-refmap.json")
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Sable Companion (compile only here, JiJ'd by the loader modules). Safe no-op when Sable isn't installed
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    // Mixin dependencies are provided by Fabric Loader automatically (like ImmersiveMC)
}

// Publishing configuration for the common module
publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.mod_id
            from components.java
        }
    }

    // Configure repositories for publishing (if needed in future)
    repositories {
        // Add repositories to publish to here
    }
}

// Java configuration is handled in root build.gradle to ensure consistency