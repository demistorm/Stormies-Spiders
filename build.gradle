plugins {
    // Architectury plugin for multi-loader builds
    id "architectury-plugin" version "${architectury_plugin_version}"
    // Loom plugin for Minecraft modding (applied to subprojects)
    id "dev.architectury.loom" version "${loom_version}" apply false
}

// Tell Architectury which Minecraft version we're targeting
architectury {
    minecraft = rootProject.minecraft_version
}

// Configure all subprojects (common/, fabric/, forge/)
subprojects {
    apply plugin: "java"
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        // ParchmentMC for mappings
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.minecraftforge.net/" }
        // Terraformers maven for ModMenu
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        // Maven Central for Night Config dependencies
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}")
        }
        // Depend on Fabric loader here to use the fabric @Environment annotations
        // This is needed for client-side code separation across all loaders
        // Do NOT use other Fabric classes in common code
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    }

    // Configure Java toolchain to use JDK 17 for the build
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // Ensure all Java compilation uses UTF-8 encoding and produces Java 17 bytecode
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    // Generate sources JAR for all subprojects (helpful for debugging)
    java {
        withSourcesJar()
    }
}

// Task to collect all production JARs into a single directory
tasks.register('collectProductionJars', Copy) {
    description = "Collect all production JARs from all loaders into dist/ directory"
    group = "build"

    // Create output directory
    def outputDir = layout.buildDirectory.dir("dist")
    into outputDir

    // Read enabled platforms from gradle.properties
    def enabledPlatforms = (project.findProperty('enabled_platforms') ?: 'fabric,neoforge').split(',')

    // Conditionally collect JARs based on enabled platforms
    if ('fabric' in enabledPlatforms) {
        from("fabric/build/libs") {
            include "*-fabric-*.jar"
            exclude "*-dev.jar", "*-dev-shadow.jar", "*-sources.jar"
        }
    }

    if ('forge' in enabledPlatforms) {
        from("forge/build/libs") {
            include "*-forge-*.jar"
            exclude "*-dev.jar", "*-dev-shadow.jar", "*-sources.jar"
        }
    }

    if ('neoforge' in enabledPlatforms) {
        from("neoforge/build/libs") {
            include "*-neoforge-*.jar"
            exclude "*-dev.jar", "*-dev-shadow.jar", "*-sources.jar"
        }
    }

    // Only copy files that exist
    eachFile { file ->
        if (!file.file.exists()) {
            exclude file.path
        }
    }

    doLast {
        println "\nProduction JARs collected to: ${outputDir.get()}"
        fileTree(outputDir).visit { file ->
            if (!file.isDirectory()) {
                println "  - ${file.name}"
            }
        }
    }
}

// Make sure JARs are built before collecting
collectProductionJars.dependsOn {
    tasks.matching { task -> task.name == "remapJar" || task.name == "jar" }
}

// Also collect after each enabled loader module builds
def enabledPlatforms = (project.findProperty('enabled_platforms') ?: 'fabric,neoforge').split(',')

if ('fabric' in enabledPlatforms) {
    project(":fabric").build.finalizedBy(collectProductionJars)
}
if ('forge' in enabledPlatforms) {
    project(":forge").build.finalizedBy(collectProductionJars)
}
if ('neoforge' in enabledPlatforms) {
    project(":neoforge").build.finalizedBy(collectProductionJars)
}

// Configure all projects (root + subprojects)
allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    // Set consistent project metadata across all loaders
    // Custom jar naming will be handled in individual subprojects
    base {
        archivesName = rootProject.mod_id
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    // Configure Java toolchain to use JDK 17 for the build
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // Consistent Java compilation settings
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    // Generate sources for all projects
    java {
        withSourcesJar()
    }
}
