pluginManagement {
    repositories {
        // Architectury Maven for Architectury plugin
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        // Fabric Maven for Loom plugin
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        // Forge Maven for Forge/NeoForge plugins
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        // ParchmentMC for mappings
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        // Standard Gradle repositories
        mavenCentral()
        gradlePluginPortal()
    }
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'StormiesSpiders'
include("common")
include("fabric")
include("neoforge")
